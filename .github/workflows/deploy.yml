name: Deploy Environment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

      ref:
        required: true
        type: string

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.APP_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up project
        uses: ./.github/actions/setup-node-project

      - name: Validate Access configuration
        run: npm run validate:access -- ${{ inputs.environment }}

      - name: Build
        run: npm run build:${{ inputs.environment }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --env ${{ inputs.environment }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke test
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: bash .github/scripts/smoke-access.sh
