name: Deploy Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seymour-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      APP_URL: ${{ vars.APP_URL }}

    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Staging releases must be started from the main branch."
          exit 1

      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Apply staging D1 migrations
        run: npm run db:migrate:staging

      - name: Deploy staging Worker
        run: npm run deploy:staging

      - name: Smoke test staging
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Set the staging GitHub Environment variable APP_URL."
            exit 1
          fi

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 2 \
            "$APP_URL/login" \
            > /dev/null

      - name: Record release candidate
        run: |
          {
            echo "## Staging release candidate"
            echo ""
            echo "- Commit to promote: \`${GITHUB_SHA}\`"
            echo "- URL: ${APP_URL}"
            echo ""
            echo "After testing, manually run the Deploy Production workflow and paste this exact commit SHA."
          } >> "$GITHUB_STEP_SUMMARY"
