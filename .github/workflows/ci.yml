name: CI

on:
  pull_request:
  push:
    branches:
      - main

  workflow_call:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup-node-project

      - name: Run checks
        run: npm run check

      - name: Build
        run: npm run build
