name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seymour-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release workflows must be started from the main branch."
          exit 1

      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Verify default build
        run: npm run build

      - name: Record release candidate
        run: |
          {
            echo "## Seymour release candidate"
            echo ""
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  staging:
    name: Deploy staging
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      APP_URL: ${{ vars.APP_URL }}

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply staging D1 migrations
        run: npm run db:migrate:staging

      - name: Deploy staging Worker
        run: npm run deploy:staging

      - name: Smoke test staging
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Set the staging GitHub Environment variable APP_URL."
            exit 1
          fi

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 2 \
            "$APP_URL/login" \
            > /dev/null

      - name: Record staging deployment
        run: |
          {
            echo "## Staging deployed"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- URL: ${APP_URL}"
            echo ""
            echo "Test this staging deployment before approving the production job."
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Deploy production
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Configure the GitHub "production" Environment with a required reviewer.
    # GitHub will pause this job before it starts and before these secrets
    # become available.
    environment: production

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      APP_URL: ${{ vars.APP_URL }}

    steps:
      - name: Checkout exact staged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply production D1 migrations
        run: npm run db:migrate:production

      - name: Deploy production Worker
        run: npm run deploy:production

      - name: Smoke test production
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Set the production GitHub Environment variable APP_URL."
            exit 1
          fi

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 2 \
            "$APP_URL/login" \
            > /dev/null

      - name: Record production deployment
        run: |
          {
            echo "## Production deployed"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- URL: ${APP_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
