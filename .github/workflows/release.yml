name: Release

on:
  push:
    branches:
      - "release/**"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    uses: ./.github/workflows/release-check.yml

  staging:
    name: Staging
    needs: check

    uses: ./.github/workflows/deploy.yml

    with:
      environment: staging
      ref: ${{ github.sha }}

    secrets: inherit

  production:
    name: Production
    needs:
      - check
      - staging

    uses: ./.github/workflows/deploy.yml

    with:
      environment: production
      ref: ${{ github.sha }}

    secrets: inherit

  publish:
    name: Publish
    needs:
      - check
      - production

    permissions:
      contents: write

    uses: ./.github/workflows/publish.yml

    with:
      ref: ${{ github.sha }}
      version: ${{ needs.check.outputs.version }}
      tag: ${{ needs.check.outputs.tag }}
