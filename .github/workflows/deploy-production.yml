name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact commit SHA that was tested on staging
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: seymour-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify staged commit and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      APP_URL: ${{ vars.APP_URL }}
      RELEASE_SHA: ${{ inputs.release_sha }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify release commit belongs to main
        shell: bash
        run: |
          git fetch origin main

          if ! git cat-file -e "${RELEASE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::Release SHA does not identify a commit in this repository."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "::error::Release SHA is not contained in main."
            exit 1
          fi

          git checkout --detach "$RELEASE_SHA"

          echo "Deploying exact staged commit: $RELEASE_SHA"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks on release commit
        run: npm run check

      - name: Apply production D1 migrations
        run: npm run db:migrate:production

      - name: Deploy production Worker
        run: npm run deploy:production

      - name: Smoke test production
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Set the production GitHub Environment variable APP_URL."
            exit 1
          fi

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 2 \
            "$APP_URL/login" \
            > /dev/null

      - name: Record production deployment
        run: |
          {
            echo "## Production deployed"
            echo ""
            echo "- Commit: \`${RELEASE_SHA}\`"
            echo "- URL: ${APP_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
