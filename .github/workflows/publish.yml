name: Publish Release

on:
  workflow_call:
    inputs:
      ref:
        description: Commit that was deployed to production
        required: true
        type: string

      version:
        description: Release version without the v prefix
        required: true
        type: string

      tag:
        description: Git tag to create
        required: true
        type: string

jobs:
  publish:
    name: Publish ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout production commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Verify tag does not already exist
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git fetch --tags

          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "::error::Tag ${RELEASE_TAG} already exists."
            exit 1
          fi

      - name: Create release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag \
            --annotate "$RELEASE_TAG" \
            "$RELEASE_SHA" \
            --message "Seymour ${RELEASE_VERSION}"

          git push origin "$RELEASE_TAG"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Seymour ${RELEASE_TAG}" \
            --generate-notes

      - name: Release summary
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.ref }}
        run: |
          {
            echo "## Release published"
            echo ""
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Commit: \`${RELEASE_SHA}\`"
            echo ""
            echo "If release-only fixes were made, merge the release branch back into main before deleting it."
          } >> "$GITHUB_STEP_SUMMARY"
