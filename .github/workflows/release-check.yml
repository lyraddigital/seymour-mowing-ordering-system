name: Release Check

on:
  workflow_call:
    outputs:
      version:
        description: Release version
        value: ${{ jobs.check.outputs.version }}

      tag:
        description: Release tag
        value: ${{ jobs.check.outputs.tag }}

jobs:
  check:
    name: Check release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Determine release version
        id: release
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"

          if [[ "$VERSION" == "$GITHUB_REF_NAME" ]]; then
            echo "::error::Release branches must be named release/<version>."
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release branch must be named release/<major>.<minor>.<patch>."
            exit 1
          fi

          TAG="v${VERSION}"

          git fetch --tags

          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check
