name: Setup Node Project

description: Checkout the repository, configure Node, and install dependencies.

inputs:
  ref:
    description: Git ref or commit to checkout
    required: false
    default: ""

runs:
  using: composite

  steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci
